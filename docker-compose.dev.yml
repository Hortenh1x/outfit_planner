services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: outfit_planner
      POSTGRES_USER: outfit
      POSTGRES_PASSWORD: outfit
    ports:
      # Host port is intentionally non-default (15433, not 5433) so this stack
      # never collides with other local projects publishing 5432/5433. Inside
      # the compose network the API still reaches Postgres on postgres:5432.
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./outfit_planner_back/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit -d outfit_planner"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: outfit
      MINIO_ROOT_PASSWORD: outfit-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:8-alpine
    ports:
      # Host port is intentionally non-default (16379, not 6379) to avoid
      # colliding with other local projects. The API uses redis:6379 inside
      # the compose network regardless of this host mapping.
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    # Wait until postgres and redis are actually reachable before launching the
    # app. dotnet watch does NOT relaunch the app after a startup crash (it just
    # waits for a file change), so a dependency race would otherwise leave the
    # container "Up" but the API dead. Looping here also auto-heals once the
    # dependencies come back, with no manual `docker compose restart api`.
    command: >
      bash -c "until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do echo 'waiting for postgres:5432...'; sleep 1; done;
      until (exec 3<>/dev/tcp/redis/6379) 2>/dev/null; do echo 'waiting for redis:6379...'; sleep 1; done;
      echo 'postgres and redis reachable - starting API';
      exec dotnet watch --project src/OutfitPlanner.Api/OutfitPlanner.Api.csproj run --no-launch-profile --urls https://0.0.0.0:8081"
    working_dir: /src
    restart: unless-stopped
    # Report real serving state in `docker compose ps` (previously the container
    # showed "Up" while the API process had crashed). start_period covers the
    # first restore/build.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8081/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/outfit-planner-dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: outfit-dev-cert
      DetailedErrors: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Authentication__PublicOrigin: https://localhost:5173
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=outfit_planner;Username=outfit;Password=outfit;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
    ports:
      - "5001:8081"
    volumes:
      - ./outfit_planner_back:/src
      - api_storage:/src/src/OutfitPlanner.Api/storage
      - ./.aspnet/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    command: sh -c "npm ci && npm run dev:docker"
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_DEV_HTTPS: "true"
      VITE_DEV_HTTPS_PFX: /https/outfit-planner-dev.pfx
      VITE_DEV_HTTPS_PFX_PASSPHRASE: outfit-dev-cert
      VITE_DEV_API_TARGET: https://api:8081
      # Hosts allowed when the dev server is exposed on a public domain via the tunnel.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-outfitplanner.net}
    ports:
      - "5173:5173"
    volumes:
      - ./outfit_planner_front:/app
      - frontend_node_modules:/app/node_modules
      - ./.aspnet/https:/https:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
  api_storage:
  frontend_node_modules:
