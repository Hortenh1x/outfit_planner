services:
  rembg:
    image: danielgatis/rembg:latest
    command:
      - s
      - --host
      - 0.0.0.0
      - --port
      - "7000"
      - --log_level
      - info
      - --no-ui
    volumes:
      - rembg_models:/root/.u2net
    restart: unless-stopped

  api:
    volumes:
      - ./outfit_planner_back:/src
      - ./outfit_planner_back/src/OutfitPlanner.Api/storage:/src/src/OutfitPlanner.Api/storage
      - ./.aspnet/https:/https:ro
      - api_dataprotection:/root/.aspnet/DataProtection-Keys

    # Wait until postgres and redis are actually reachable before launching the
    # app. dotnet watch does NOT relaunch the app after a startup crash (it just
    # waits for a file change), so a dependency race would otherwise leave the
    # container "Up" but the API dead. Looping here also auto-heals: once the
    # dependencies come back (e.g. after a host-port conflict is cleared), the
    # API starts on its own with no manual `docker compose restart api`.
    command: >
      bash -c "until (exec 3<>/dev/tcp/postgres/5432) 2>/dev/null; do echo 'waiting for postgres:5432...'; sleep 1; done;
      until (exec 3<>/dev/tcp/redis/6379) 2>/dev/null; do echo 'waiting for redis:6379...'; sleep 1; done;
      echo 'postgres and redis reachable - starting API';
      exec dotnet watch --project src/OutfitPlanner.Api/OutfitPlanner.Api.csproj run --no-launch-profile --urls https://0.0.0.0:8081"

    environment:
      Authentication__PublicOrigin: ${PUBLIC_ORIGIN}

      TryOn__Provider: Fashn

      Fashn__ApiKey: ${FASHN_API_KEY}
      Fashn__BaseUrl: ${FASHN_BASE_URL}
      Fashn__ModelName: ${FASHN_MODEL_NAME}
      Fashn__Mode: ${FASHN_MODE}
      Fashn__MaxPollingAttempts: "90"
      Fashn__PollIntervalSeconds: "2"
      Fashn__TimeoutSeconds: "180"

      Fashn__NumSamples: ${FASHN_NUM_SAMPLES}
      Fashn__OutputFormat: ${FASHN_OUTPUT_FORMAT}
      Fashn__ReturnBase64: ${FASHN_RETURN_BASE64}
      Fashn__SegmentationFree: ${FASHN_SEGMENTATION_FREE}
      Fashn__GarmentPhotoType: ${FASHN_GARMENT_PHOTO_TYPE}
      Fashn__Seed: ${FASHN_SEED}
      Fashn__Resolution: ${FASHN_RESOLUTION}
      Fashn__GenderPromptTemplate: ${FASHN_GENDER_PROMPT_TEMPLATE}

      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Authentication__Apple__ClientId: ${APPLE_CLIENT_ID}
      Authentication__Apple__ClientSecret: ${APPLE_CLIENT_SECRET}

      # Password reset emails: SMTP activates when SMTP_HOST is present in .env (STARTTLS on 587).
      Email__Provider: ${EMAIL_PROVIDER:-Auto}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Outfit Planner}
      # Role pins: the owner admin pin is built into the API; premium pins come only from .env.
      Roles__PinnedAdminEmails: ${ROLES_PINNED_ADMIN_EMAILS:-}
      Roles__PinnedPremiumEmails: ${ROLES_PINNED_PREMIUM_EMAILS:-}
      # Stage-4 billing: Stripe activates when STRIPE_SECRET_KEY is present in .env;
      # blank values keep billing softly disabled (the app works unchanged).
      Billing__Provider: ${BILLING_PROVIDER:-Auto}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PremiumMonthlyPriceId: ${STRIPE_PREMIUM_MONTHLY_PRICE_ID:-}
      Stripe__PremiumMonthlyDisplayPrice: ${STRIPE_PREMIUM_MONTHLY_DISPLAY_PRICE:-}
      # Top-up pack catalog (mounted source has an appsettings.json, but env wins and
      # keeps the pack set identical to the production stack).
      Stripe__TopUpPacks__0__Id: pack-20
      Stripe__TopUpPacks__0__Credits: "20"
      Stripe__TopUpPacks__0__PriceId: ${STRIPE_TOPUP_PACK_20_PRICE_ID:-}
      Stripe__TopUpPacks__0__DisplayPrice: ${STRIPE_TOPUP_PACK_20_DISPLAY_PRICE:-}
      Stripe__TopUpPacks__1__Id: pack-50
      Stripe__TopUpPacks__1__Credits: "50"
      Stripe__TopUpPacks__1__PriceId: ${STRIPE_TOPUP_PACK_50_PRICE_ID:-}
      Stripe__TopUpPacks__1__DisplayPrice: ${STRIPE_TOPUP_PACK_50_DISPLAY_PRICE:-}
      Stripe__TopUpPacks__2__Id: pack-100
      Stripe__TopUpPacks__2__Credits: "100"
      Stripe__TopUpPacks__2__PriceId: ${STRIPE_TOPUP_PACK_100_PRICE_ID:-}
      Stripe__TopUpPacks__2__DisplayPrice: ${STRIPE_TOPUP_PACK_100_DISPLAY_PRICE:-}

      BackgroundRemoval__Provider: RembgServer
      BackgroundRemoval__RembgServer__Endpoint: http://rembg:7000/api/remove
      BackgroundRemoval__RembgServer__ImageFieldName: file
      # u2netp is the lightest rembg model (~5MB weights): minimal CPU/RAM per upload.
      # Trade-off: rougher edges than birefnet-general-lite; bump back if quality matters.
      BackgroundRemoval__RembgServer__ModelName: u2netp
      BackgroundRemoval__RembgServer__TimeoutSeconds: "60"

    depends_on:
      rembg:
        condition: service_started

volumes:
  rembg_models:
  api_dataprotection: