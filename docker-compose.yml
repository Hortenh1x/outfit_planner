services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: outfit_planner
      POSTGRES_USER: outfit
      POSTGRES_PASSWORD: outfit
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./outfit_planner_back/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit -d outfit_planner"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: outfit
      MINIO_ROOT_PASSWORD: outfit-secret
    volumes:
      - minio_data:/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./outfit_planner_back
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=outfit_planner;Username=outfit;Password=outfit;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
      # Required outside Development: signs private object URLs. Never commit the value.
      ObjectStorage__Local__SigningSecret: ${OBJECT_STORAGE_SIGNING_SECRET:?set OBJECT_STORAGE_SIGNING_SECRET to a strong random secret for signed object URLs}
      # Public origin for OAuth redirect URIs + absolute signed URLs (from .env). Empty = OAuth off.
      Authentication__PublicOrigin: ${PUBLIC_ORIGIN:-}
      PublicOrigin: ${PUBLIC_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: outfit_planner_front/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.secrets/tls/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./.secrets/tls/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  redis_data:
  api_storage:
