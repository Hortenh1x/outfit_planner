services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: outfit_planner
      POSTGRES_USER: outfit
      POSTGRES_PASSWORD: outfit
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./outfit_planner_back/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit -d outfit_planner"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: outfit
      MINIO_ROOT_PASSWORD: outfit-secret
    volumes:
      - minio_data:/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./outfit_planner_back
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=outfit_planner;Username=outfit;Password=outfit;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
      # Required outside Development: signs private object URLs. Never commit the value.
      ObjectStorage__Local__SigningSecret: ${OBJECT_STORAGE_SIGNING_SECRET:?set OBJECT_STORAGE_SIGNING_SECRET to a strong random secret for signed object URLs}
      # Public origin for OAuth redirect URIs + absolute signed URLs (from .env). Empty = OAuth off.
      Authentication__PublicOrigin: ${PUBLIC_ORIGIN:-}
      PublicOrigin: ${PUBLIC_ORIGIN:-}
      # Stage-4 billing: Stripe activates when STRIPE_SECRET_KEY is present in .env;
      # blank values keep billing softly disabled (the app works unchanged).
      Billing__Provider: ${BILLING_PROVIDER:-Auto}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__PremiumMonthlyPriceId: ${STRIPE_PREMIUM_MONTHLY_PRICE_ID:-}
      Stripe__PremiumMonthlyDisplayPrice: ${STRIPE_PREMIUM_MONTHLY_DISPLAY_PRICE:-}
      # Top-up pack catalog (the image ships no appsettings.json, so packs are defined
      # here; packs without a PriceId are not offered).
      Stripe__TopUpPacks__0__Id: pack-20
      Stripe__TopUpPacks__0__Credits: "20"
      Stripe__TopUpPacks__0__PriceId: ${STRIPE_TOPUP_PACK_20_PRICE_ID:-}
      Stripe__TopUpPacks__0__DisplayPrice: ${STRIPE_TOPUP_PACK_20_DISPLAY_PRICE:-}
      Stripe__TopUpPacks__1__Id: pack-50
      Stripe__TopUpPacks__1__Credits: "50"
      Stripe__TopUpPacks__1__PriceId: ${STRIPE_TOPUP_PACK_50_PRICE_ID:-}
      Stripe__TopUpPacks__1__DisplayPrice: ${STRIPE_TOPUP_PACK_50_DISPLAY_PRICE:-}
      Stripe__TopUpPacks__2__Id: pack-100
      Stripe__TopUpPacks__2__Credits: "100"
      Stripe__TopUpPacks__2__PriceId: ${STRIPE_TOPUP_PACK_100_PRICE_ID:-}
      Stripe__TopUpPacks__2__DisplayPrice: ${STRIPE_TOPUP_PACK_100_DISPLAY_PRICE:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - api_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: outfit_planner_front/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      # host ports are overridable so this stack can co-exist with another
      # 80/443 consumer on the same machine (see .env.example)
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./.secrets/tls/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./.secrets/tls/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  redis_data:
  api_storage:
